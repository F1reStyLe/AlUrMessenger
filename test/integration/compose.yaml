# Изолированный test fixture, не deployment Compose (он появится на шаге 1.3).
# Project name, ports и секреты задаёт scripts/test-infrastructure.ps1.
services:
  postgres:
    image: postgres@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: alur
      POSTGRES_PASSWORD_FILE: /run/test-secrets/postgres-admin
    ports: ["127.0.0.1:${ALUR_TEST_PG_PORT:?}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
      - ${ALUR_TEST_SECRETS:?}:/run/test-secrets:ro
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d alur"]
      interval: 2s
      timeout: 3s
      retries: 40
  redis:
    image: redis@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    command: [redis-server, /run/test-secrets/redis.conf]
    ports: ["127.0.0.1:${ALUR_TEST_REDIS_PORT:?}:6379"]
    volumes:
      - redis-data:/data
      - ${ALUR_TEST_SECRETS:?}:/run/test-secrets:ro
  kafka:
    image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
    ports: ["127.0.0.1:${ALUR_TEST_KAFKA_PORT:?}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${ALUR_TEST_KAFKA_PORT:?}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  minio:
    # Legacy Community server применяется только для local compatibility tests.
    image: quay.io/minio/minio@sha256:d249d1fb6966de4d8ad26c04754b545205ff15a62e4fd19ebd0f26fa5baacbc0
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: test-root
      MINIO_ROOT_PASSWORD_FILE: /run/test-secrets/minio-admin
    ports: ["127.0.0.1:${ALUR_TEST_MINIO_PORT:?}:9000"]
    volumes:
      - minio-data:/data
      - ${ALUR_TEST_SECRETS:?}:/run/test-secrets:ro
  minio-account:
    image: quay.io/minio/mc@sha256:fb8f773eac8ef9d6da0486d5dec2f42f219358bcb8de579d1623d518c9ebd4cc
    entrypoint: [/bin/sh, /init/minio-account.sh]
    depends_on: [minio]
    volumes:
      - ${ALUR_TEST_SECRETS:?}:/run/test-secrets:ro
      - ./minio-account.sh:/init/minio-account.sh:ro
      - ./minio-policy.json:/init/policy.json:ro
volumes:
  pg-data:
  redis-data:
  minio-data:
